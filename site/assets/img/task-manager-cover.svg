  <rect x="51" y="287" width="55" height="20" rx="3" fill="#3c414c"/><text x="78.5" y="301" text-anchor="middle" fill="#d0d6eb" font-family="Arial,sans-serif" font-size="10">PATCH</text><text x="122" y="301" fill="#e5dcd6" font-family="monospace" font-size="12">/tasks/{id}</text><text x="337" y="301" text-anchor="end" fill="#afa3a0" font-family="Arial,sans-serif" font-size="10">Update</text>
