name: React Aqua Workstation quality gate

on:
  push:
    branches:
      - main
      - feat/react-aqua-workstation-v3-20261008
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package.json"

      - name: Install React toolchain
        run: npm install --no-audit --no-fund

      - name: Install Python API dependencies
        run: python -m pip install -r api/requirements.txt pip-audit

      - name: Audit API dependencies
        run: pip-audit -r api/requirements.txt

      - name: Static type safety
        run: npm run typecheck

      - name: Frontend unit tests
        run: |
          npm run test:unit
          node --test tests/*.test.mjs

      - name: API Python tests
        run: |
          python -m compileall -q api scripts
          python -m unittest discover -s api/tests -v

      - name: Build React app through Cloudflare-compatible entrypoint
        run: python scripts/build_site.py

      - name: Validate output and bilingual content
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-1.55.0

      - name: Install headless Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run 320px–4K responsive browser tests
        run: |
          python -m http.server 4173 --directory dist >/tmp/portfolio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          python - <<'PY'
          import socket, time
          for _ in range(80):
              try:
                  with socket.create_connection(("127.0.0.1", 4173), timeout=0.3):
                      break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit("Preview server failed to start.")
          PY
          UI_BASE_URL=http://127.0.0.1:4173 npm run test:ui

      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-aqua-v3-visual-checks
          path: artifacts/ui
          if-no-files-found: ignore

      - name: Production artifact gate
        run: |
          test -s dist/index.html
          test -s dist/en/index.html
          test -s dist/_headers
          test -s dist/data/projects.json
          test -s dist/assets/img/oc-portrait.jpg
          test -s dist/privacidade.html
          test -s dist/en/privacy.html
          test -s dist/404.html
