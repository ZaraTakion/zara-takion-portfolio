name: Validate static portfolio and Python API

on:
  push:
    branches:
      - main
      - codex/portfolio-static-python
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Node for JavaScript syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r api/requirements.txt
      - name: Check Python syntax and tests
        run: |
          python -m compileall -q api scripts
          python -m unittest discover -s api/tests -v
          python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check site/assets/js/main.js && node --check site/config.js
      - name: Build static site
        run: python scripts/build_site.py
      - name: Check generated output
        run: test -s dist/index.html && test -s dist/config.js && test -s dist/data/projects.json