name: Validate static portfolio and Python API

on:
  push:
    branches:
      - main
      - codex/portfolio-complete-refresh
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Node for JavaScript syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r api/requirements.txt
      - name: Check Python syntax and tests
        run: |
          python -m compileall -q api scripts
          python -m unittest discover -s api/tests -v
          python -m unittest discover -s tests -v
      - name: Check JavaScript syntax and tests
        run: |
          for file in site/scripts/*.js; do node --check "$file"; done
          node --test tests/*.test.mjs
      - name: Build static site
        run: python scripts/build_site.py
      - name: Install browser smoke-test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run responsive browser smoke tests
        run: |
          python -m http.server 4173 --directory dist >/tmp/portfolio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          python - <<'PY'
          import socket
          import time

          for _ in range(50):
              try:
                  with socket.create_connection(("127.0.0.1", 4173), timeout=0.2):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("Local preview server did not start.")
          PY
          UI_BASE_URL=http://127.0.0.1:4173 node scripts/ui-smoke.mjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-ui-screenshots
          path: artifacts/ui
          if-no-files-found: ignore
      - name: Check generated output
        run: test -s dist/index.html && test -s dist/_headers && test -s dist/data/projects.json
